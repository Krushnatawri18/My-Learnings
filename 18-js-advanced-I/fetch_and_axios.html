<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>User Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>

<body class="min-h-screen bg-gray-100 flex flex-col justify-center items-center">
    <div class="flex flex-col items-center gap-8 w-full max-w-6xl px-4 mb-10">
        <div class="users
            grid
            grid-cols-1
            sm:grid-cols-2
            md:grid-cols-3
            lg:grid-cols-5
            gap-6
            place-items-center">
        </div>

        <div class="refresh-div"></div>
    </div>

    <div>
        <form id="myForm" class="flex flex-col">
            <input type="text" id="name" placeholder="Name" required /></br></br>
            <input type="email" id="email" placeholder="Email" required /></br></br>
            <button type="submit" class="bg-green-500 px-6 py-2 rounded-lg text-white border border-green-700 hover:bg-green-600 transition">Submit</button>
        </form>

        <p id="message"></p>
    </div>

    <script src="fetch_and_axios.js" defer></script>
</body>

</html>
