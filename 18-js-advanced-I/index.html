<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Js</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="form-container">
        <h2>User Profile Form</h2>
        <form id="profileForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>

            <label for="profession">Profession:</label>
            <input type="text" id="profession" name="profession" placeholder="Enter your profession" required>

            <label for="bio">Bio:</label>
            <textarea id="bio" name="bio" placeholder="Write a short bio" rows="4" required></textarea>

            <label for="url">Profile URL:</label>
            <input type="url" id="url" name="url" placeholder="https://example.com" required>

            <button type="submit">Submit</button>
        </form>
    </div>
    <div class="users">
        <div class="user-cards">
            
        </div>
    </div>
    <script src="async_await_promises.js"></script>
</body>

</html>
